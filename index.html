<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><link
    rel="icon"
    href="./game/index.icon.png"
  /><title>First Light — Field Studies</title
  ><link rel="stylesheet" href="./npc/ui.css" />
  <main>
    <nav aria-label="Scenes">
      <button id="board" aria-pressed="true">First Light</button
      ><button id="forge" aria-pressed="false" disabled>The Forge</button>
    </nav>
    <div class="cols">
      <iframe id="game" title="Live Godot scene"></iframe>
      <aside id="drawer" hidden>
        <p class="eyebrow">CAMP ARTISANS &nbsp; / &nbsp; THE SMITH</p>
        <h1 id="who">The Forge</h1>
        <p id="witness"></p>
        <p>
          Load a dialogue model to talk, or enable just the character voice below to audition a line.
          Selected models are downloaded on first use and reused while cached. Your words stay on this device.
        </p>
        <label
          >Import a studio card <input id="import" type="file" accept=".json,application/json"
        /></label>
        <p id="note" role="status"></p>
        <div id="chat"></div>
      </aside>
    </div>
  </main>
  <script type="module" src="./npc/game.mjs"></script>
</html>
